<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Unidades</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 450px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultado {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .historial {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .historial ul {
            margin: 10px 0 0 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <h2>Conversor de Unidades</h2>

    <!-- El formulario envía los datos por POST a nuestro servidor Python -->
    <form action="/" method="POST">
        <div class="form-group">
            <label for="valor">Cantidad a convertir:</label>
            <input type="number" step="any" name="valor" id="valor" required placeholder="Ej: 100">
        </div>

        <div class="form-group">
            <label for="tipo_conversion">Tipo de conversión:</label>
            <select name="tipo_conversion" id="tipo_conversion">
                <option value="km_a_millas">Kilómetros a Millas</option>
                <option value="millas_a_km">Millas a Kilómetros</option>
                <option value="c_a_f">Celsius a Fahrenheit</option>
                <option value="f_a_c">Fahrenheit a Celsius</option>
            </select>
        </div>

        <button type="submit">Convertir</button>
    </form>

    <!-- Jinja2 (motor de plantillas de Flask) mostrará el resultado cuando Python lo envíe -->
    {% if resultado is not none %}
        <div class="resultado">
            Resultado: {{ resultado }}
        </div>
    {% endif %}

    {% if historial %}
        <div class="historial">
            <strong>Historial de conversiones recientes:</strong>
            <ul>
                {% for item in historial %}
                    <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

</body>
</html>
